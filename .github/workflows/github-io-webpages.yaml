name: github-io-webpages

# Runs ebmc over the LogikBench and HWMCC08 benchmark suites and the
# chipsalliance/sv-tests SystemVerilog conformance suite, and publishes a
# small benchmark index plus per-suite HTML reports to GitHub Pages.

on:
  # Refresh the published report whenever main changes.
  push:
    branches: [ main ]
  # Weekly, to pick up new LogikBench circuits.
  schedule:
    - cron: '0 4 * * 1'
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Allow the job to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# A single in-progress deployment at a time; do not cancel a running one.
concurrency:
  group: pages-benchmarks
  cancel-in-progress: false

jobs:
  # Build ebmc and generate the benchmark reports for GitHub Pages.
  run-benchmarks:
    name: Generate benchmark reports
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Fetch dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get remove --purge man-db
          packages_to_install="flex bison libxml2-utils ccache wget python3-pip"
          if ! sudo apt-get install --no-install-recommends -yq $packages_to_install ; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -yq $packages_to_install
          fi
      - name: Prepare ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ${{ runner.os }}-24.04-make-gcc-logikbench-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-24.04-make-gcc-logikbench
            ${{ runner.os }}-24.04-make-gcc
      - name: ccache environment
        run: |
          echo "CCACHE_BASEDIR=$PWD" >> $GITHUB_ENV
          echo "CCACHE_DIR=$PWD/.ccache" >> $GITHUB_ENV
      - name: Zero ccache stats and limit in size
        run: ccache -z --max-size=500M
      - name: Get cadical and minisat
        run: make -C lib/cbmc/src cadical-download minisat2-download
      - name: Build ebmc with make
        run: make -C src ebmc.dir -j4 CXX="ccache g++" MINISAT2=../../minisat-2.2.1 CADICAL=../../cadical
      - name: Save ccache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: .ccache
          key: ${{ runner.os }}-24.04-make-gcc-logikbench-${{ github.sha }}
      - name: Try the ebmc binary
        run: ./src/ebmc/ebmc --version
      - name: Run ebmc on the benchmark suites
        run: |
          mkdir -p _site/logikbench _site/hwmcc
          PATH=$PATH:$PWD/src/ebmc benchmarking/logikbench.sh _site/logikbench/index.html
          PATH=$PATH:$PWD/src/ebmc benchmarking/hwmcc08-report.sh _site/hwmcc/index.html
      - name: Run sv-tests
        run: |
          mkdir -p _site/sv-tests
          PATH=$PATH:$PWD/src/ebmc examples/chipsalliance-sv-tests/sv-tests.sh
          cp -r sv-tests/out/report/. _site/sv-tests/
      - name: Generate the benchmark landing page
        run: cp benchmarking/index.html _site/index.html
      - name: Upload the report as a Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Publish the report to GitHub Pages.  Skipped on forks, where Pages is
  # not configured.
  deploy:
    name: Publish report to GitHub Pages
    needs: run-benchmarks
    if: github.event_name != 'pull_request' && github.repository == 'diffblue/hw-cbmc'
    runs-on: ubuntu-slim
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
